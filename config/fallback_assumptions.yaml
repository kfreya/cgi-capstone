# Shared fallback assumptions for validation and scoring.
# Evidence counts are aggregate validation outputs from cleaned_opportunity_df
# (src.opportunity_cleaner.clean_opportunity_df) as of 2026-05-14.
# Re-run notebooks/role2_validation.ipynb to refresh.

- rule_id: revenue_hierarchy
  field_resolved: authoritative_revenue
  primary: total_estimated_revenue
  fallback: opportunity_estimated_revenue_base_cad
  when_to_use_fallback: total_estimated_revenue is null
  if_both_missing: row excluded from any load calculation; flag in audit
  helper: src.data_validator.apply_revenue_hierarchy(df)
  evidence:
    n_total: 8746
    n_primary_null: 51
    n_fallback_null: 1067
    n_both_null: 0
    n_both_present: 7628
    pct_agreement_within_5pct_on_overlap: 99.5
    note: >
      Sprint 2: Yixiao's merge now carries opportunity_estimated_revenue_base_cad
      onto matched rows, not just opps1-exclusive rows. The two fields overlap
      on 7,628 rows and agree within 5% on 99.5% of them, which validates the
      fallback as the same metric on a different schema. The primary is null
      only on the 51 opps1-exclusive rows; the fallback is null only on the
      1,067 unmatched opps2 rows. No row has both null.
  risk: low

- rule_id: do_not_sum_service_solution_revenue
  field_resolved: authoritative_revenue
  rule: never sum service_solution_estimated_revenue onto authoritative_revenue
  reason: >
    service_solution_estimated_revenue is a service-line breakdown that has
    been collapsed to one row per opportunity in opportunity_cleaner. Adding
    it on top of total_estimated_revenue would double-count revenue.
  evidence:
    n_service_null: 3833
    n_service_zero: 148
  risk: low

- rule_id: delivery_window
  field_resolved: delivery_active
  primary_start: revenue_start_date
  fallback_start: close_date
  duration_field: project_duration_number_of_months
  when_to_use_fallback: revenue_start_date is null
  if_both_missing: delivery_active = 0; flag in audit; do not impute
  active_predicate: effective_start <= as_of <= effective_start + duration_months
  evidence:
    n_won_total: 5290
    n_won_resolvable_via_primary: 5275
    n_won_resolvable_via_fallback: 15
    n_won_unresolvable: 0
    note: >
      n_won_total moved from 5,275 (Sprint 1) to 5,290 because the Sprint 2
      outcome taxonomy (status_reason_outcome) now classifies the 15
      status==Won / null-reason rows as Won. Those 15 rows resolve their
      delivery window via the close_date fallback, so the fallback path is
      now exercised. Zero Won rows are unresolvable.
  risk: low

- rule_id: missing_duration
  field_resolved: project_duration_number_of_months
  primary: actual value
  fallback: 12 months
  when_to_use_fallback: value is null OR <= 0
  rationale: >
    Median Won-deal duration is 12 months in the current data; using it as
    a default keeps short and long projects from collapsing to zero load.
  evidence:
    n_duration_null: 852
    n_duration_zero: 43
    n_duration_over_60_months: 152
  risk: medium
  notes_for_lyken: >
    capacity_engine.compute_sales_load and compute_delivery_load already
    fillna(12) silently. Recommend adding a counter that exposes how many
    rows triggered the default so we can tell "zero sales effort" rows
    apart from "missing data" rows. The 152 rows over 60 months are not
    covered by this rule and currently inflate any duration-weighted term.

- rule_id: missing_probability
  field_resolved: probability
  primary: actual value
  fallback: 0
  when_to_use_fallback: value is null
  rationale: >
    A null probability is treated as "no committed sales effort" so the
    pipeline term collapses to zero, matching the architecture's intent
    for unscored deals. An explicit probability of 0 is a valid value, not
    a missing one, and is left as-is.
  evidence:
    n_probability_null: 77
    n_probability_zero: 139
    n_probability_negative: 0
    n_probability_above_100: 0
  risk: medium
  notes_for_lyken: same default-fill counter recommendation as duration.

- rule_id: status_reason_outcome
  field_resolved: opportunity_outcome
  primary: status_reason
  fallback: status
  when_to_use_fallback: status_reason is null or blank
  helper: src.data_validator.classify_opportunity_outcome(df)
  buckets: [won, lost, open, duplicate, unknown]
  taxonomy:
    won: status_reason == "won" (or status fallback "won")
    open: status_reason == "open" (or status fallback "open")
    lost: >
      status_reason starting with "lost", "cancelled", or "canceled"
      (or status fallback "closed" -- the opportunity ended unwon, reason
      unrecorded). This is the Option B decision: Cancelled is a genuine
      pipeline exit and is lost-like.
    duplicate: >
      status_reason == "duplicated". Option B carves this into its own
      bucket and excludes it from win/lost/open counts -- it is a CRM
      data-hygiene label, not a sales outcome.
    unknown: status_reason null/blank and status is none of the above
  decision: >
    Option B. Profiling cleaned_opportunity_df showed status_reason ==
    "Duplicated" has zero overlap with the merge-level duplicate_flag and is
    concentrated in just 3 owners, so it is a CRM duplicate-record marker,
    not a merge artefact and not a win/loss business outcome. Folding it into
    lost_opportunity_count would distort those 3 owners' loss counts and win
    rates. Option A (Duplicated counts as lost) and Option C (three separate
    outcome columns) were rejected -- see docs/data_validation.md section 5.
  evidence:
    n_status_reason_null: 51
    n_won: 5290
    n_lost: 2630
    n_duplicate: 461
    n_open: 365
    n_unknown: 0
    n_duplicated_overlap_with_duplicate_flag: 0
    n_owners_with_duplicated_rows: 3
  risk: medium
  notes_for_lyken_and_yixiao: >
    Import classify_opportunity_outcome rather than re-deriving buckets with
    string checks. This rule subsumes the Sprint 1 won_detection rule. The
    Option B treatment of "Duplicated" is the validation owner's
    recommendation pending CGI confirmation; if CGI says it counts as a loss,
    move "duplicated" from DUPLICATE_REASONS into the lost set -- nothing
    else downstream changes.

- rule_id: won_detection
  field_resolved: is_won
  status: subsumed_by status_reason_outcome
  primary: status_reason == "Won"
  fallback: status == "Won" when status_reason is null/blank
  rationale: >
    Kept as a back-reference only. The Sprint 1 won_detection fallback is now
    the status fallback inside status_reason_outcome, generalised to every
    outcome bucket. classify_opportunity_outcome is the single source of
    truth; capacity_engine.py should not re-implement won detection.
  evidence:
    n_status_won_vs_status_reason_won_disagreement: 15
  risk: low

- rule_id: late_stage_definition
  field_resolved: late_stage_deal_count
  values:
    - "4-Proposal"
    - "5-Client Decision"
    - "6-Negotiation&Signature"
  scope: status == "Open"
  rationale: >
    Architecture distinguishes late-stage open opportunities (which carry
    near-term winning probability) from earlier stages. Won deals are
    explicitly excluded -- they belong to delivery load.
  risk: low

- rule_id: baseline_reliability
  field_resolved: baseline_reliability
  thresholds:
    high: quarters_of_data >= 8
    medium: 4 <= quarters_of_data < 8
    low: quarters_of_data < 4
  rationale: >
    Owners with fewer than four quarters of CRM activity have a noisy
    historical baseline; capacity scores derived against that baseline
    should be displayed with a reliability tag in the dashboard.
  evidence:
    n_owners_total: 24
    n_owners_high: 3
    n_owners_medium: 13
    n_owners_low: 8
    n_owners_with_zero_quarters: 2
    n_owners_with_under_10_lifetime_opps: 7
    note: >
      Sprint 2 observes 8 Low-tier owners (Sprint 1 saw none). Two of them
      have quarters_of_data = 0 -- their rows are entirely opps1-exclusive
      with null created_on, so they have no usable baseline at all and should
      get an explicit "insufficient history" state, not a Low-confidence
      score.
  risk: medium
